# Execução local (sem HTTPS e sem certbot): http://localhost:8080
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d osrm nominatim nginx
# No .env.local do site: MAPAS_URL=http://localhost:8080 e o mesmo MAPAS_TOKEN.
services:
  nginx:
    ports: !override ["8080:80"]
    environment:
      MAPAS_DOMINIO: localhost
    volumes: !override
      - ./nginx/local:/etc/nginx/templates:ro
      - ./dados:/srv/tiles:ro
  certbot:
    profiles: [nunca]
